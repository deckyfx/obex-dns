name = "obex-dns"
main = "src/index.ts"
compatibility_date = "2026-02-28"
compatibility_flags = ["nodejs_compat"]
# account_id = ""
minify = true
# workers_dev = false
preview_urls = false

[build]
command = "npm run build"

# Custom domain. Wrangler creates and manages the DNS record on deploy.
# An explicit record for this hostname takes precedence over the zone's
# existing *.decky.win wildcard, which is left untouched.
[[routes]]
pattern = "dns.decky.win"
custom_domain = true

[assets]
directory = "./static"
binding = "ASSETS"
# Route the HTML document through the Worker. Without this, Cloudflare's asset
# server answers "/" before the Worker runs, so applySecurityHeaders() never
# executes for the page - it ships with no Content-Security-Policy, no
# Strict-Transport-Security, no X-Content-Type-Options and no X-Frame-Options -
# and the HTMLRewriter that injects window.OBEX_CONFIG never runs either, so
# isDbMissing / isJwtSecretMissing are always undefined on "/".
#
# Scoped to the document rather than set to `true`, so the hashed asset files
# keep being served directly by the asset server at no Worker invocation cost.
# Deep links already reach the Worker: they match no asset and fall through to
# the SPA handler.
run_worker_first = ["/", "/index.html"]

# D1 Database for Profiles, Rules and Logs
[[d1_databases]]
binding = "DB"
database_name = "dns_worker_db"
# This field must be filled with your database ID; otherwise the deployment will fail.
database_id = "57721cc5-8d85-43d5-9f53-318e5d5c511b"

[triggers]
crons = ["* * * * *"]

[placement]
# mode = "targeted"
# region = "aws:ap-southeast-1"
# Or
# hostname = "dbs.com.sg"
# Or
# mode = "smart"
# Or
mode = "off"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 0.001

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[vars]
# Default upstream for fail-open emergency fallback
FAIL_OPEN_UPSTREAM = "https://freedns.controld.com/no-ads-malware-typo"
# Maximum number of access points allowed per profile
MAX_ACCESS_POINTS_PER_PROFILE = 100
# Set to "false" to close public registration. Bootstrap is always permitted:
# while no account exists the first signup still succeeds and becomes admin,
# so a deployment can be brought up with this already false.
SIGNUP_ENABLED = "false"
# Maximum number of profiles allowed per user
MAX_PROFILES_PER_USER = 10
# Used to resolve DoH domains
SUBSTITUTE_DOMAIN="www.okx.com"
IP_REGION_CN = """
[
  {
    "ip": "198.41.222.102",
    "area": "SG"
  },
  {
    "ip": "173.245.59.246",
    "area": "SG"
